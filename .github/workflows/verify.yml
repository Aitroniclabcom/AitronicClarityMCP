name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev
      - run: docker build -t clarity-mcp:verify .
      - name: Verify container startup
        run: |
          docker run -d --name clarity-test -e ADMIN_PASSWORD=ci-only-test-password-32-characters -e ENCRYPTION_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa clarity-mcp:verify
          sleep 3
          docker exec clarity-test curl --fail http://127.0.0.1:3000/health
